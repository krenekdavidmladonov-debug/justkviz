packages:
  - apps/*
  - functions
  - packages/*
  - tools/*

confirmModulesPurge: false

allowBuilds:
  '@firebase/util@1.15.3': true
  'esbuild@0.28.2': true
  'protobufjs@7.6.6': true
  're2@1.26.1': false
  re2: set this to true or false

# The managed Windows workspace blocks Rollup's native .node binary in OneDrive.
# The official WASM build exposes the same API and keeps local builds portable.
overrides:
  rollup: npm:@rollup/wasm-node@4.63.1
  # Same-major security fixes for the Functions and Firebase transport graphs.
  '@grpc/grpc-js': 1.14.7
  proxy-addr: 2.0.8
  'body-parser@1': 1.20.9
  qs: 6.17.1
  'postcss>source-map-js': 1.2.2
  # Security fixes have no patched release on the legacy major branches.
  'uuid@<11.1.1': 11.1.1
  '@google-cloud/pubsub>@opentelemetry/core': 2.8.0
  'glob@>=9 <14.0.2': 14.0.3
  'minimatch@<11.0.1': 11.0.3
  # Current advisory fixes on the same major as each affected CLI/web dependency.
  'undici@6': 6.29.1
  'undici@8': 8.12.2
  'morgan@1': 1.12.1
  'fast-uri@3': 3.1.9
  'ip-address@10': 10.7.4
  'hono@4': 4.13.11
  'compression@1': 1.8.2
  '@modelcontextprotocol/sdk@1': 1.32.0
  'zod@4': 4.6.6
  'body-parser@2': 2.4.0
  're2js@2': 2.8.7
  '@hono/node-server@2': 2.1.3

patchedDependencies:
  minimatch@11.0.3: tools/dependencies/patches/minimatch@11.0.3.patch
