name: Offline event acceptance

# Prepared only; publishing or executing this workflow requires the owner's separate approval.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-event:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-filmovy-kviz-v2.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-filmovy-kviz-v2
      VITE_FIREBASE_STORAGE_BUCKET: demo-filmovy-kviz-v2.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      VITE_FIREBASE_APP_ID: 1:123456789:web:demo
      VITE_FIREBASE_USE_EMULATORS: "true"
      REGISTRATION_EMAIL_MODE: "off"
      FIREBASE_CLI_DISABLE_USAGE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install declared pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Use Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Use Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install native synthetic media tool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install locked dependencies and local browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Download official local emulator binaries before the network-denied campaign
        run: |
          pnpm exec firebase setup:emulators:firestore --project demo-filmovy-kviz-v2
          pnpm exec firebase setup:emulators:storage --project demo-filmovy-kviz-v2
      # Native Windows memory and capacity validation is mandatory on the local Windows runner.
      - name: Offline core with real stopped backends
        run: pnpm check:offline:core
