name: CI quick checks
on: workflow_call
permissions:
  contents: read

jobs:
  checks:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-filmovy-kviz-v2.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-filmovy-kviz-v2
      VITE_FIREBASE_STORAGE_BUCKET: demo-filmovy-kviz-v2.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      VITE_FIREBASE_APP_ID: 1:123456789:web:demo
      VITE_FIREBASE_USE_EMULATORS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, and production build
        run: pnpm check

      - name: Unit and synthetic migration regression tests
        run: pnpm test:unit

      - name: Verify CI evidence contracts
        run: node --test tools/deploy/ci-proof.test.mjs tests/ci-quality-gate.test.mjs
